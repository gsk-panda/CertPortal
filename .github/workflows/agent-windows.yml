name: Windows agent MSI

on:
  push:
    branches: [main]
    tags: ['agent-v*']
    paths: ['agent/**', 'src/config.js', 'src/services/panos/**', '.github/workflows/agent-windows.yml']
  pull_request:
    paths: ['agent/**', 'src/config.js', 'src/services/panos/**', '.github/workflows/agent-windows.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # set these repo secrets to sign with Azure Trusted Signing; unsigned otherwise
      SIGNING_CONFIGURED: ${{ secrets.AZURE_CLIENT_ID != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'   # the Node runtime embedded in the exe

      - name: Install msitools
        run: sudo apt-get update && sudo apt-get install -y wixl msitools

      - name: Build agent exe
        working-directory: agent
        run: |
          npm ci --no-audit --no-fund
          node windows/build.js

      - name: Azure login (signing)
        if: env.SIGNING_CONFIGURED == 'true'
        uses: azure/login@v2
        with:
          creds: '{"clientId":"${{ secrets.AZURE_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}","tenantId":"${{ secrets.AZURE_TENANT_ID }}"}'
          allow-no-subscriptions: true

      - name: Sign exes
        if: env.SIGNING_CONFIGURED == 'true'
        run: |
          curl -sSfL -o jsign.jar https://github.com/ebourg/jsign/releases/download/7.1/jsign-7.1.jar
          SIGN_TOKEN=$(az account get-access-token --resource https://codesigning.azure.net --query accessToken -o tsv)
          echo "::add-mask::$SIGN_TOKEN"
          echo "SIGN_TOKEN=$SIGN_TOKEN" >> "$GITHUB_ENV"
          java -jar jsign.jar --storetype TRUSTEDSIGNING \
            --keystore "${{ secrets.TRUSTED_SIGNING_ENDPOINT }}" --storepass "$SIGN_TOKEN" \
            --alias "${{ secrets.TRUSTED_SIGNING_ACCOUNT }}/${{ secrets.TRUSTED_SIGNING_PROFILE }}" \
            --tsaurl http://timestamp.acs.microsoft.com/ --tsmode RFC3161 \
            agent/windows/dist/certportal-agent.exe agent/windows/dist/certportal-agent-service.exe

      - name: Build MSI
        working-directory: agent
        run: node windows/build.js --msi-only

      - name: Sign MSI
        if: env.SIGNING_CONFIGURED == 'true'
        run: |
          java -jar jsign.jar --storetype TRUSTEDSIGNING \
            --keystore "${{ secrets.TRUSTED_SIGNING_ENDPOINT }}" --storepass "$SIGN_TOKEN" \
            --alias "${{ secrets.TRUSTED_SIGNING_ACCOUNT }}/${{ secrets.TRUSTED_SIGNING_PROFILE }}" \
            --tsaurl http://timestamp.acs.microsoft.com/ --tsmode RFC3161 \
            agent/windows/dist/certportal-agent.msi

      - uses: actions/upload-artifact@v4
        with:
          name: certportal-agent-msi
          path: agent/windows/dist/certportal-agent.msi

  install-test:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'   # runs the mock control plane

      - uses: actions/download-artifact@v4
        with:
          name: certportal-agent-msi

      - name: Install test
        run: pwsh agent/windows/test/install-test.ps1 -Msi certportal-agent.msi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: install-logs
          path: '*.log'

  release:
    # tag agent-vX.Y.Z to publish; the portal links to releases/latest
    if: startsWith(github.ref, 'refs/tags/agent-v')
    needs: install-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: certportal-agent-msi
      - uses: softprops/action-gh-release@v2
        with:
          files: certportal-agent.msi
